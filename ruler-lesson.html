:root{
  /* A sunflower field at school: forest-green header, sky-to-meadow page, gold for action, clay red only for "fix this". */
  /* Layout: brand + vine progress chain in one top band, one job per screen on paper cards, big Back/Next over the hills. */
  --forest:#123f2c; --forest-2:#1c5a3d; --ink:#132a33; --muted:#52666d;
  --sun:#ffb81c; --sun-deep:#c97a00; --sun-soft:#fff0bf; --leaf:#2f8f43; --leaf-soft:#e2f4d3; --sprout:#7ccf6b;
  --paper:#fffdf6; --hot:#cf3d1c; --hot-soft:#fde4dc; --line:#d3ded2;
  --display:"Grandstander","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Lexend","Segoe UI",Verdana,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#dcf0fb 0%,#eef7ee 62%,#f7f6da 100%) fixed;color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;font-size:clamp(14px,1.35vw,19px)}
button{font-family:var(--body);font-size:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
button:disabled{cursor:default}

.top{flex:none;display:flex;align-items:center;gap:22px;padding:7px 20px;background:linear-gradient(180deg,var(--forest-2),var(--forest));border-bottom:4px solid var(--sun);box-shadow:0 6px 16px -8px rgba(18,63,44,.6);position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;color:#ffd75e;font-size:clamp(15px,1.7vw,23px);white-space:nowrap;letter-spacing:.01em}
.brand svg{width:clamp(26px,2.6vw,36px);height:auto;flex:none}
.brand small{font-family:var(--body);font-weight:500;color:#bfe0cc;font-size:.62em;letter-spacing:.08em;text-transform:uppercase;margin-left:4px}
.chain{flex:1;min-width:0;display:flex;align-items:center}
.chain button{flex:1 1 0;min-width:0;border:0;background:none;padding:0;display:flex;align-items:center;gap:6px;color:#a9cdb8;font-size:clamp(10px,1.05vw,14px);font-weight:500}
.chain button:disabled{color:#6f9c84}
.chain .dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #4f8468;display:grid;place-items:center;font-size:.9em;font-weight:600;position:relative;transition:transform .25s}
.chain .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chain button.now{flex:0 0 auto}
.chain button.now .nm{overflow:visible;font-family:var(--display);font-weight:700;font-size:1.25em;color:#fff;margin-right:8px}
.chain button.now .bar{flex:0 0 14px}
@media (max-width:1150px){.chain button:not(.now) .nm{display:none}.chain button:not(.now){gap:0}.chain button:not(.now) .bar{min-width:4px}}
@media (max-width:760px){.brand span,.brand small{display:none}.top{gap:12px;padding:7px 12px}main{padding:8px 12px 4px}footer{padding:6px 12px 10px}}
.chain .bar{flex:1;height:4px;background:#2f6a4d;min-width:6px;border-radius:2px;position:relative;overflow:hidden}
.chain .bar::after{content:"";position:absolute;inset:0;background:var(--sprout);transform:scaleX(0);transform-origin:left;transition:transform .5s ease}
.chain button:last-child .bar{display:none}
.chain button.done .dot{background:var(--sprout);border-color:var(--sprout);color:var(--forest)}
.chain button.done .bar::after{transform:scaleX(1)}
.chain button.now{color:#fff;font-weight:600}
.chain button.now .dot{border:0;width:34px;height:34px;color:#3b2600;margin:-4px 0}
.chain button.now .dot svg{position:absolute;inset:-3px;width:calc(100% + 6px);height:calc(100% + 6px);animation:spin 40s linear infinite}
.chain button.now .dot b{position:relative;font-weight:700;color:#fff}

main{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 24px 4px;gap:6px;position:relative;z-index:1}
h1{font-family:var(--display);font-weight:700;color:var(--forest);font-size:clamp(22px,2.9vw,40px);line-height:1.08;margin:0;letter-spacing:-.005em}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:0 1px 0 #fff inset,0 12px 24px -16px rgba(18,63,44,.55)}
.grid-paper{background-color:var(--paper);background-image:linear-gradient(#edf3e8 1.5px,transparent 1.5px),linear-gradient(90deg,#edf3e8 1.5px,transparent 1.5px);background-size:26px 26px;background-position:-1px -1px}

footer{flex:none;display:flex;align-items:center;gap:12px;padding:6px 24px 12px;position:relative;z-index:1}
.nav{border:0;border-radius:14px;padding:9px 28px;font-size:clamp(16px,1.7vw,22px);font-weight:700;font-family:var(--display);transition:transform .08s,box-shadow .08s,filter .2s}
#back{background:var(--paper);border:2px solid var(--forest);color:var(--forest);box-shadow:0 4px 0 #9fb5a6}
#next{background:linear-gradient(180deg,#ffd257,#ffab0f);color:#3b2600;margin-left:auto;box-shadow:0 4px 0 var(--sun-deep),0 10px 16px -8px rgba(0,0,0,.35)}
#next:not(:disabled){animation:nudge 2.4s ease-in-out infinite}
.nav:not(:disabled):hover{filter:brightness(1.05)}
.nav:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-deep)}
.nav:disabled{opacity:.4;filter:grayscale(.7)}
.hills{position:fixed;left:0;right:0;bottom:0;width:100%;height:min(120px,17vh);z-index:0;pointer-events:none}

.mx{white-space:nowrap;font-weight:600}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-size:.62em;line-height:1.05;vertical-align:middle;margin:0 .1em 0 .14em}
.fr i{font-style:normal}
.fr i:first-child{border-bottom:.13em solid currentColor;padding:0 .18em .04em}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes nudge{0%,86%,100%{transform:none}92%{transform:translateX(4px)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.petal{position:fixed;width:10px;height:17px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;animation:fly .9s ease-out forwards;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.printbtn{flex:none;display:flex;align-items:center;gap:7px;text-decoration:none;color:#3b2600;background:linear-gradient(180deg,#ffd257,#ffab0f);border-radius:999px;padding:6px 14px 6px 11px;font-family:var(--display);font-weight:700;font-size:clamp(12px,1.15vw,16px);box-shadow:0 3px 0 var(--sun-deep);transition:transform .08s,box-shadow .08s}
.printbtn svg{width:1.5em;height:1.5em;color:var(--forest)}
.printbtn:hover{filter:brightness(1.06)}
.printbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sun-deep)}
.printbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.toast{position:fixed;top:58px;right:16px;z-index:70;background:var(--forest);color:#fff;border:2px solid var(--sun);border-radius:14px;padding:10px 16px;font-weight:500;max-width:min(420px,80vw);box-shadow:0 12px 24px -10px rgba(0,0,0,.5);animation:rise .3s both}
.toast[hidden]{display:none}
@media (max-width:900px){.printbtn span{display:none}.printbtn{padding:6px 9px}}

main{gap:5px}
.lead{font-size:clamp(15px,1.9vw,26px);margin:0;min-height:1.3em;max-width:80ch;line-height:1.25}
.stage{flex:1;min-height:0;border:1.5px solid var(--line);border-radius:20px;position:relative;box-shadow:0 1px 0 #fff inset,0 14px 28px -18px rgba(18,63,44,.6);overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
svg text{font-family:var(--body);fill:var(--ink)}
svg .disp{font-family:var(--display);font-weight:700}
svg .scene.enter{animation:rise .45s cubic-bezier(.2,.8,.3,1) both}
svg .new{animation:fadein .5s .1s both}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.controls:empty{display:none}
.controls button{border:2px solid #93ab9b;background:#fff;color:var(--ink);border-radius:999px;padding:6px 16px;font-size:clamp(13px,1.4vw,18px);font-weight:600;box-shadow:0 3px 0 #c0cec3;transition:transform .08s,box-shadow .08s}
.controls button:active{transform:translateY(2px);box-shadow:0 1px 0 #c0cec3}
.controls button.on{background:var(--forest);border-color:var(--forest);color:#fff;box-shadow:0 3px 0 #06231a,0 0 0 3px var(--sun)}
.controls .msg{font-size:clamp(14px,1.6vw,21px);font-weight:600;color:var(--forest)}
.controls input[type=range]{width:min(360px,30vw);accent-color:var(--leaf)}
.notes{background:var(--sun-soft);border:1.5px solid var(--sun);border-left-width:8px;padding:7px 14px;border-radius:12px;font-size:clamp(12px,1.25vw,16px);line-height:1.4;max-height:22vh;overflow:auto;animation:rise .25s both}
.notes b{font-family:var(--display);font-weight:700;color:var(--forest)}
.notes[hidden]{display:none}
footer .small{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:clamp(11px,1.1vw,14px);font-weight:500;color:var(--forest)}
footer .small[aria-pressed=true]{background:var(--sun);border-color:var(--sun-deep);color:#3b2600}
.reveal{display:flex;gap:6px;margin-left:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:6px 10px}
.reveal:empty{display:none}
.reveal i{width:10px;height:10px;border-radius:50%;background:#cfdccf;transition:background .3s,transform .3s}

 },

  [[2,"Nearest half inch"],[4,"Nearest quarter inch"]].forEach(m=>{const b=h("button",{textContent:m[1],className:nearestMode===m[0]?"on":""},c);b.onclick=()=>{nearestMode=m[0];setNearest(nearestLen)}});
  const r=h("input",{type:"range",min:8,max:94,value:nearestLen,id:"nearSlider"},c);r.setAttribute("aria-label","Stem length");r.oninput=()=>setNearest(+r.value,true);
 }},
{nm:"We do",title:"We do: Ruler Practice page",stages:1,
 lead:()=>"Measure the bar on your page first. Then we check it together.",
 say:"Work bar by bar. Students measure bar 1 on paper and write the length. Then press Show on a ruler, then Show the answer. Bars 1 to 6 land right on a line. Bars 7 and 8 stop between lines: 7 is to the nearest quarter inch, 8 is to the nearest half inch. Walk the room during bars 3 to 6 and check the zero line on every desk.",
 draw(g){
  const ppi=180,x0=90,y=210,s16=PRACTICE[pracIdx],L=s16/16*ppi,cols=["#f6c453","#8ecae6","#f4a6a0","#b7d98b","#cdb4f0","#f6c453","#8ecae6","#f4a6a0"];
  label(g,x0,90,"Bar "+(pracIdx+1),40,{anchor:"start",cls:"disp"});
  label(g,x0+150,90,pracIdx===7?"nearest half inch":"nearest quarter inch",26,{anchor:"start",fill:C.muted});
  el("rect",{x:x0,y:y-60,width:L,height:60,fill:cols[pracIdx],stroke:C.ink,"stroke-width":3},g);
  if(pracRuler){const hi={};if(pracAns)hi[PRACTICE_ANS[pracIdx]*4]=C.hot;ruler(g,{x0,y,ppi,to:6,level:pracIdx===7?2:4,h:120,hi});el("line",{x1:x0+L,x2:x0+L,y1:y-80,y2:y+12,stroke:C.ink,"stroke-width":3,"stroke-dasharray":"5 5"},g)}
  if(pracAns){svgFrac(g,540,420,PRACTICE_ANS[pracIdx],60,C.hot);label(g,620,420,"inches",40,{anchor:"start",fill:C.hot,cls:"disp"})}
 },
 controls(c){
  PRACTICE.forEach((_,i)=>{const b=h("button",{textContent:i+1,className:i===pracIdx?"on":""},c);b.setAttribute("aria-label","Bar "+(i+1));b.onclick=()=>{pracIdx=i;pracRuler=pracAns=false;render()}});
  const a=h("button",{textContent:pracRuler?"Hide the ruler":"Show on a ruler"},c);a.onclick=()=>{pracRuler=!pracRuler;if(!pracRuler)pracAns=false;render()};
  const b=h("button",{textContent:pracAns?"Hide the answer":"Show the answer"},c);b.onclick=()=>{pracAns=!pracAns;if(pracAns)pracRuler=true;render()};
 }},
{nm:"Board",title:"Come up and measure",stages:1,
 lead:()=>"Drag the ruler to the leaf. Zero. Straight. Read.",
 say:"Call students up one at a time, or drag it yourself while the class directs you. Class says the three words. Press Check zero before reading. Press New leaf for another one. Leaves are 1 1/2 to 5 1/2 inches, always on a quarter inch line.",
 draw(g){
  const ppi=180,x0=110,yc=150,L=board.q/4*ppi;
  leafShape(g,x0,yc,L,Math.min(150,L*.5));
  const rg=el("g",{style:"cursor:grab"},g);
  const hi={};if(board.show)hi[board.q*4]=C.hot;
  ruler(rg,{x0,y:yc,ppi,to:6,level:4,h:110,hi});
  rg.setAttribute("transform",`translate(${board.dx},${board.dy})`);
  if(board.show){svgFrac(g,540,430,board.q,58,C.hot);label(g,620,430,"inches",40,{anchor:"start",fill:C.hot,cls:"disp"})}
  let d=null;const svg=document.getElementById("svg");
  rg.addEventListener("pointerdown",e=>{const p=svgPoint(e);d={x:p.x-board.dx,y:p.y-board.dy};svg.setPointerCapture(e.pointerId);e.preventDefault()});
  svg.onpointermove=e=>{if(!d)return;const p=svgPoint(e);board.dx=Math.max(-80,Math.min(200,p.x-d.x));board.dy=Math.max(-60,Math.min(200,p.y-d.y));rg.setAttribute("transform",`translate(${board.dx},${board.dy})`)};
  svg.onpointerup=svg.onpointercancel=()=>{if(!d)return;d=null;if(Math.abs(board.dx)<14&&Math.abs(board.dy)<18){board.dx=0;board.dy=0}board.checked=false;board.show=false;render()};
 },
 controls(c){
  const ok=Math.abs(board.dx)<1&&Math.abs(board.dy)<1;
  const a=h("button",{textContent:"Check zero"},c);a.onclick=()=>{board.checked=true;render()};
  const b=h("button",{textContent:board.show?"Hide the answer":"Show the answer"},c);b.onclick=()=>{board.show=!board.show;if(board.show){board.dx=0;board.dy=0}render()};
  const n=h("button",{textContent:"New leaf"},c);n.onclick=()=>{let q;do{q=6+Math.floor(Math.random()*17)}while(q===board.q);board={q,dx:60+Math.random()*120,dy:90+Math.random()*90,checked:false,show:false};render()};
  if(board.checked)h("span",{className:"msg",textContent:ok?"Zero is on the tip and the ruler is straight. Now read it.":(Math.abs(board.dx)>=1?"Not yet. Slide the ruler until the 0 line touches the left tip.":"Not yet. Slide the ruler edge up to the leaf, tip to tip.")},c);
 }},
{nm:"Next",title:"Next: the Sunflower Lab",stages:1,
 lead:()=>"You will get your own sunflower. Your stem and leaves are different from your neighbor's.",
 say:"Hand out the sunflower pages so table partners have different sunflowers. Students do NOT cut yet. They measure, write each length on the paper, then open the Sunflower Lab and tap the name printed on their page. The lab checks every measurement and then teaches the line plot.",
 draw(g){
  const rows=[["1","Do not cut yet."],["2","Measure the STEM to the nearest half inch. Write it on the stem."],["3","Measure each LEAF to the nearest quarter inch. Write it on the leaf."],["4","Open the Sunflower Lab. Tap the name of your sunflower."]];
  rows.forEach((r,i)=>{el("circle",{cx:120,cy:90+i*92,r:30,fill:C.sun,stroke:C.ink,"stroke-width":3},g);label(g,120,101+i*92,r[0],32,{cls:"disp"});label(g,175,101+i*92,r[1],30,{anchor:"start"})});
 }}
];

const FLOWER='<svg viewBox="-50 -50 100 100" aria-hidden="true">'+[[32,.5,"#e89a00"],[30,0,"#ffc21a"]].map(r=>Array.from({length:16},(_,i)=>`<ellipse cx="${r[0]}" cy="0" rx="15.5" ry="6.5" fill="${r[2]}" stroke="#b77400" stroke-width="1" transform="rotate(${(i+r[1])*22.5})"/>`).join("")).join("")+'<circle r="19" fill="#6b3f1d" stroke="#4a2c12" stroke-width="1.5"/><circle r="12" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="3" stroke-dasharray="1 4"/></svg>';
/* ---------- shell ---------- */
let step=0,stage=0,prevStage=-1,notesOn=false,stepFresh=true;
const $=id=>document.getElementById(id);
function setNearest(v,fromSlider){v=Math.max(8,Math.min(94,v));const unit=16/nearestMode;if(v%unit!==0&&(v%unit)*2===unit)v+=1;nearestLen=v;render();if(!fromSlider){const s=$("nearSlider");if(s)s.value=v}}
function buildChain(){const c=$("chain");c.textContent="";STEPS.forEach((s,i)=>{const b=h("button",{type:"button"},c);b.className=i<step?"done":i===step?"now":"";b.setAttribute("aria-current",i===step?"step":"false");const d=h("span",{className:"dot"},b);d.innerHTML=i<step?"\u2713":i===step?FLOWER+"<b>"+(i+1)+"</b>":String(i+1);h("span",{className:"nm",textContent:s.nm},b);h("span",{className:"bar"},b);b.onclick=()=>go(i,0)})}
function render(){
  const s=STEPS[step],svg=$("svg");
  const keepSlider=document.activeElement&&document.activeElement.id==="nearSlider";
  svg.textContent="";svg.onpointermove=svg.onpointerup=svg.onpointercancel=null;
  svg.innerHTML='<defs><linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffeaa8"/><stop offset="1" stop-color="#f2c75f"/></linearGradient><linearGradient id="leafg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6f2bf"/><stop offset="1" stop-color="#aede8d"/></linearGradient><filter id="sh" x="-5%" y="-20%" width="110%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#123f2c" flood-opacity=".28"/></filter><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#2f8f43"/></marker></defs>';
  $("title").textContent=s.title;$("lead").textContent=s.lead(stage);
  animNew=prevStage===stage-1&&stage>0;s.draw(el("g",{class:"scene"+(stepFresh?" enter":"")},svg),stage,prevStage);animNew=false;stepFresh=false;prevStage=-9;
  if(!keepSlider){const c=$("controls");c.textContent="";if(s.controls)s.controls(c)}
  else{[...$("controls").querySelectorAll("button")].forEach(b=>{})}
  $("notes").innerHTML="";const nb=h("b",{textContent:"Say and do: "},$("notes"));$("notes").appendChild(document.createTextNode(s.say));$("notes").hidden=!notesOn;
  const rv=$("reveal");rv.textContent="";if(s.stages>1)for(let i=0;i<s.stages;i++)h("i",{className:i<=stage?"on":""},rv);
  $("back").disabled=step===0&&stage===0;$("next").disabled=step===STEPS.length-1&&stage===s.stages-1;
  $("next").textContent=stage<s.stages-1?"Show next":"Next";
  buildChain();
}
function go(st,sg){prevStage=(st===step)?stage:-1;stepFresh=st!==step;step=st;stage=sg;render()}
function next(){const s=STEPS[step];if(stage<s.stages-1)go(step,stage+1);else if(step<STEPS.length-1)go(step+1,0)}
function back(){if(stage>0)go(step,stage-1);else if(step>0)go(step-1,STEPS[step-1].stages-1)}
$("next").onclick=next;$("back").onclick=back;
$("notesBtn").onclick=()=>{notesOn=!notesOn;$("notesBtn").setAttribute("aria-pressed",notesOn);render()};
function fs(){try{const d=document;if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
$("fsBtn").onclick=fs;
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"||e.key==="PageDown"){next();e.preventDefault()}else if(e.key==="ArrowLeft"||e.key==="PageUp"){back();e.preventDefault()}else if(e.key==="n"||e.key==="N")$("notesBtn").click();else if(e.key==="f"||e.key==="F")fs()});
document.getElementById("brand").insertAdjacentHTML("afterbegin",FLOWER);
render();

</script>
